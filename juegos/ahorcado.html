<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ahorcado</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><meta name="description" content="Juega Ahorcado gratis en Sala de Juegos."><meta name="theme-color" content="#fff1e4"><link rel="stylesheet" href="../css/sala.css"><link rel="stylesheet" href="../css/mejoras.css"><link rel="stylesheet" href="../css/movil.css"><script src="../js/sala.js"></script><script src="../js/datos.js"></script><script src="../js/palabras.js"></script></head><body><style>
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:520px;margin:14px auto}
.key{width:40px;height:44px;padding:0;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:var(--panel2);color:var(--text);font:700 16px var(--body);cursor:pointer}
.key:disabled{opacity:.35;cursor:default}.key.ok{background:rgba(76,175,110,.3);border-color:var(--ok)}.key.no{background:rgba(230,80,60,.25);border-color:var(--bad)}
.word{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.ch{width:34px;height:46px;border-bottom:4px solid var(--gold);text-align:center;font:600 30px/46px var(--head)}
.ch.miss{color:var(--bad)}
.gal{display:block;margin:0 auto;width:200px;height:220px}.gal *{stroke:var(--text);stroke-width:5;fill:none;stroke-linecap:round}
.gal .p{opacity:0;transition:opacity .25s}.gal .p.on{opacity:1;stroke:var(--bad)}
.msg{font:600 18px var(--head)}
</style><div class="wrap" style="--accent:#f55c7a">
 <div class="top"><a class="back" href="../index.html">‹ Menú</a><h1>🪢 Ahorcado</h1><div class="pill" id="score">0</div></div>
 <div class="panel" id="host"></div></div>
<script>
function shuffleSeed(a,s){const r=mulberry(s);a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const POOL=shuffleSeed(WORDS_UP,2026).slice(0,2000);
const LV={e:['Fácil','3–5 letras',w=>w.length<=5],m:['Medio','6–7 letras',w=>w.length>=6&&w.length<=7],h:['Difícil','8 o más letras',w=>w.length>=8]};
const host=$('#host'),pill=$('#score');let lv=store.get('ah_lv','e'),pts=store.get('ah_pts',0),streak=0;
function menu(){
 host.innerHTML='<h3>Dificultad</h3><div id="sg"></div><p class="muted" id="dd"></p><p class="muted">Banco de '+fmt(POOL.length)+' palabras posibles. 6 errores y pierdes.</p><button class="btn" id="go">Jugar</button>';
 const info=()=>{$("#dd").textContent=LV[lv][1]+' · '+fmt(POOL.filter(LV[lv][2]).length)+' palabras en este nivel'};
 seg($('#sg'),Object.entries(LV).map(([k,v])=>[k,v[0]]),lv,k=>{lv=k;store.set('ah_lv',k);info()});info();
 $('#go').onclick=play;pill.textContent=pts;
}
function play(){Sala.cancel();Sala.countdown(_play)}
function _play(){
 const list=POOL.filter(LV[lv][2]),idx=rnd(0,list.length-1),W=list[idx];let miss=0,hints=1,over=false,msg='';const got=new Set();
 host.innerHTML='<svg class="gal" viewBox="0 0 200 220"><path d="M20 210H110M60 210V20H140V45"/><circle class="p" cx="140" cy="62" r="17"/><path class="p" d="M140 79V130"/><path class="p" d="M140 92L118 115"/><path class="p" d="M140 92L162 115"/><path class="p" d="M140 130L120 168"/><path class="p" d="M140 130L160 168"/></svg><div class="word" id="wd"></div><div class="msg" style="text-align:center" id="ms"></div><div class="keys" id="ks"></div><div style="text-align:center"><button class="btn ghost" id="hn">💡 Pista (1)</button><button class="btn ghost" id="nw">Otra palabra</button><button class="btn ghost" id="mn">Menú</button></div>';
 const parts=[...host.querySelectorAll('.p')];
 $('#ks').innerHTML='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c=>'<button class="key" data-c="'+c+'">'+c+'</button>').join('');
 const draw=()=>{$('#wd').innerHTML=[...W].map(c=>'<div class="ch '+(over&&!got.has(c)?'miss':'')+'">'+(got.has(c)||over?c:'')+'</div>').join('');parts.forEach((p,i)=>p.classList.toggle('on',i<miss));
  $('#ms').textContent=over?msg:'Errores: '+miss+'/6 · Palabra n.º '+(idx+1)+' de '+fmt(list.length)};
 function guess(c){
  const b=$('[data-c="'+c+'"]');if(over||!b||b.disabled)return;b.disabled=true;
  if(W.includes(c)){got.add(c);b.classList.add('ok');tone(600,.1)}else{miss++;b.classList.add('no');tone(180,.15,'square')}
  if([...W].every(x=>got.has(x)))end(true);else if(miss>=6)end(false);else draw();
 }
 function end(win){over=true;streak=win?streak+1:0;if(win){pts+=W.length*10-miss*5;store.set('ah_pts',pts)}
  msg=win?'¡Completado! Era '+W+' · racha '+streak:'Perdiste. La palabra era '+W;draw();pill.textContent=pts;host.querySelectorAll('.key').forEach(k=>k.disabled=true)}
 $('#ks').onclick=e=>{const k=e.target.closest('.key');if(k)guess(k.dataset.c)};
 document.onkeydown=e=>{const c=e.key.toUpperCase();if(c.length===1&&c>='A'&&c<='Z')guess(c)};
 $('#hn').onclick=()=>{if(over||!hints)return;hints--;$('#hn').textContent='💡 Pista (0)';const c=[...W].find(x=>!got.has(x));miss=Math.min(miss+1,5);guess(c)};
 $('#nw').onclick=play;$('#mn').onclick=()=>{document.onkeydown=null;menu()};pill.textContent=pts;draw();
}
menu();
</script></body></html>
