<body><style>
.pz-menu{max-width:560px;margin:0 auto}
.pz-menu h3{margin:18px 0 10px}
.pz-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pz-img{position:relative;padding:0;border:3px solid transparent;border-radius:16px;overflow:hidden;background:var(--deep);cursor:pointer;color:var(--text);font:700 13px var(--body);text-align:left;transition:transform .2s var(--ease),border-color .2s}
.pz-img:hover{transform:translateY(-2px)}.pz-img.on{border-color:var(--accent)}
.pz-img canvas{touch-action:auto;display:block;width:100%;height:auto;aspect-ratio:4/3;border-radius:0}
.pz-img span{display:block;padding:7px 10px}
.pz-up{display:flex;align-items:center;justify-content:center;aspect-ratio:auto;min-height:96px;text-align:center;border:2px dashed rgba(236,230,217,.25)}
.pz-up span{padding:12px}
.pz-up input{display:none}
.pz-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0 4px}
.pz-hud{width:100%;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:0 0 10px;padding:9px 14px;background:var(--deep);border-radius:14px;font-weight:700}
.pz-mesa{position:relative;margin:0 auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.pz-tablero{position:absolute;left:0;top:0;border-radius:6px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 2px rgba(236,230,217,.14)}
.pz-tablero img{display:block;width:100%;height:100%;opacity:.16;border-radius:6px;transition:opacity .25s}
.pz-mesa.singuia .pz-tablero img{opacity:0}
.pz-mesa.modelo .pz-tablero img{opacity:1}
.pz-bandeja{position:absolute;left:0;border-radius:14px;background:rgba(0,0,0,.14);border:2px dashed rgba(236,230,217,.12)}
.pz-p{position:absolute;touch-action:none;cursor:grab;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));will-change:left,top}
.pz-p.mov{cursor:grabbing;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5));transform:scale(1.05)}
.pz-p.ok{pointer-events:none;filter:none;animation:pzok .35s var(--ease)}
.pz-p.pista{animation:pzpista .9s 2}
@keyframes pzok{40%{transform:scale(1.08)}}
@keyframes pzpista{50%{filter:drop-shadow(0 0 10px var(--gold)) brightness(1.4)}}
.pz-fin{text-align:center;padding:10px 0 0}.pz-fin .big{font:600 56px/1.1 var(--head);color:var(--accent)}
.msg{text-align:center;min-height:24px;font-weight:700;color:var(--gold)}

<div class="wrap" style="--accent:#ffe0b8">
 <div class="top"><a class="back" href="../index.html">‹ Menú</a><h1><img class="gi" src="../img/rompecabezas.svg" alt=""><span>Rompecabezas</span></h1><div class="pill" id="score">0</div></div>

<script>
const $=(s,r=document)=>r.querySelector(s),host=$('#host'),pill=$('#score');
const tone=(f,d=.12)=>{try{playTone(f,d,'sine',.1)}catch(e){}};
/* sonido propio (esta página no carga juegos.js) */
let _ac=null;function playTone(f,d=.15,t='sine',v=.12){try{const A=window.AudioContext||window.webkitAudioContext;_ac=_ac||new A();if(_ac.state==='suspended')_ac.resume();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d)}catch(e){}}

/* ---------- Ilustraciones dibujadas con código (sin descargas) ---------- */
const BW=800,BH=600;
function rng(seed){let s=seed;return()=>((s=Math.imul(s^s>>>15,2246822507)+1013904223|0)>>>0)/4294967296}
function lin(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,col])=>g.addColorStop(o,col));return g}
function mont(c,base,amp,col,seed,n=6){const r=rng(seed);c.fillStyle=col;c.beginPath();c.moveTo(0,BH);let x=0;c.lineTo(0,base);while(x<BW){x+=BW/n*(.6+r()*.8);c.lineTo(x,base-amp*(.3+r()*.7))}c.lineTo(BW,BH);c.fill()}
const ESCENAS=[
 {n:'Atardecer',f(c){c.fillStyle=lin(c,0,0,0,BH,[[0,'#3b3a6b'],[.45,'#d9826f'],[.7,'#f2c27a']]);c.fillRect(0,0,BW,BH);
  c.fillStyle='#fff3c9';c.beginPath();c.arc(560,330,70,0,7);c.fill();c.fillStyle='rgba(255,243,201,.25)';c.beginPath();c.arc(560,330,115,0,7);c.fill();
  const r=rng(3);c.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<40;i++){c.fillRect(r()*BW,r()*200,2,2)}
  mont(c,380,170,'#5b4a7a',11);mont(c,450,140,'#3f3a64',5,7);mont(c,520,110,'#2a2c4a',9,8);
  c.fillStyle='#1d2038';c.fillRect(0,560,BW,40)}},
 {n:'Faro y mar',f(c){c.fillStyle=lin(c,0,0,0,360,[[0,'#7fb0d3'],[1,'#e9f3f6']]);c.fillRect(0,0,BW,360);
  c.fillStyle='#fff';[[120,90,60],[220,110,45],[560,70,55],[650,95,40]].forEach(([x,y,r])=>{c.beginPath();c.arc(x,y,r,0,7);c.arc(x+r*.9,y+8,r*.7,0,7);c.arc(x-r*.8,y+10,r*.6,0,7);c.fill()});
  c.fillStyle=lin(c,0,360,0,BH,[[0,'#3e86a8'],[1,'#1f4d6e']]);c.fillRect(0,360,BW,240);
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=3;const r=rng(8);for(let i=0;i<22;i++){const x=r()*BW,y=380+r()*200;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+20,y-8,x+40,y);c.stroke()}
  c.fillStyle='#8a6a4a';c.beginPath();c.moveTo(430,600);c.lineTo(470,400);c.lineTo(760,400);c.lineTo(800,600);c.fill();
  c.fillStyle='#fff';c.beginPath();c.moveTo(560,400);c.lineTo(580,170);c.lineTo(640,170);c.lineTo(660,400);c.fill();
  c.fillStyle='#d9514e';[[300,40],[225,40]].forEach(([y,h])=>c.fillRect(570+(y-300)*.05+ (y<250?4:0),y,60-(y<250?8:0),h));
  c.fillStyle='#2b353e';c.fillRect(575,130,50,40);c.fillStyle='#f2c27a';c.fillRect(583,138,34,24);c.fillStyle='#2b353e';c.beginPath();c.moveTo(565,130);c.lineTo(600,95);c.lineTo(635,130);c.fill();
  c.fillStyle='rgba(242,194,122,.25)';c.beginPath();c.moveTo(600,150);c.lineTo(0,100);c.lineTo(0,200);c.fill()}},
 {n:'Espacio',f(c){c.fillStyle=lin(c,0,0,BW,BH,[[0,'#0f1030'],[.6,'#2a1f5e'],[1,'#5b2a6e']]);c.fillRect(0,0,BW,BH);
  const r=rng(21);for(let i=0;i<150;i++){c.fillStyle=`rgba(255,255,255,${.3+r()*.7})`;const s=r()*2.5+.5;c.fillRect(r()*BW,r()*BH,s,s)}
  const g=c.createRadialGradient(560,200,10,560,200,150);g.addColorStop(0,'#ffe29a');g.addColorStop(1,'#d9826f');c.fillStyle=g;c.beginPath();c.arc(560,200,120,0,7);c.fill();
  c.strokeStyle='rgba(255,230,180,.8)';c.lineWidth=14;c.beginPath();c.ellipse(560,200,200,40,-.35,0,7);c.stroke();
  c.fillStyle='#7fb0d3';c.beginPath();c.arc(170,420,70,0,7);c.fill();c.fillStyle='#7fc4a3';c.beginPath();c.arc(150,410,26,0,7);c.arc(200,445,20,0,7);c.fill();
  c.fillStyle='#e8b865';c.beginPath();c.arc(380,500,22,0,7);c.fill();
  c.save();c.translate(360,250);c.rotate(-.6);c.fillStyle='#ece6d9';c.beginPath();c.moveTo(0,-70);c.quadraticCurveTo(34,-20,24,50);c.lineTo(-24,50);c.quadraticCurveTo(-34,-20,0,-70);c.fill();
  c.fillStyle='#7fb0d3';c.beginPath();c.arc(0,-14,14,0,7);c.fill();c.fillStyle='#d9514e';c.beginPath();c.moveTo(-24,30);c.lineTo(-48,66);c.lineTo(-24,50);c.fill();c.beginPath();c.moveTo(24,30);c.lineTo(48,66);c.lineTo(24,50);c.fill();
  c.fillStyle='#f2a43a';c.beginPath();c.moveTo(-14,50);c.lineTo(0,100);c.lineTo(14,50);c.fill();c.restore()}},
 {n:'Bosque',f(c){c.fillStyle=lin(c,0,0,0,BH,[[0,'#bfe3d0'],[1,'#f2e6b8']]);c.fillRect(0,0,BW,BH);
  c.fillStyle='#fff6c9';c.beginPath();c.arc(150,120,48,0,7);c.fill();
  const pino=(x,y,s,col)=>{c.fillStyle='#6b4a32';c.fillRect(x-6*s,y,12*s,40*s);c.fillStyle=col;for(let i=0;i<3;i++){c.beginPath();c.moveTo(x,y-90*s+i*38*s);c.lineTo(x+(46+i*14)*s,y-20*s+i*30*s-12*s);c.lineTo(x-(46+i*14)*s,y-20*s+i*30*s-12*s);c.fill()}};
  [[90,430,.9],[250,400,.7],[420,420,.8],[560,390,.65],[700,430,.95]].forEach(([x,y,s],i)=>pino(x,y,s*.8,'#5fa683'));
  c.fillStyle='#7fc4a3';c.beginPath();c.moveTo(0,600);c.lineTo(0,470);c.quadraticCurveTo(300,420,BW,490);c.lineTo(BW,600);c.fill();
  [[160,500,1.1],[360,520,1.5],[600,505,1.3],[740,540,1.7]].forEach(([x,y,s])=>pino(x,y,s,'#3f8a68'));
  c.fillStyle='#d9826f';const r=rng(5);for(let i=0;i<12;i++){const x=r()*BW,y=520+r()*70;c.beginPath();c.arc(x,y,6,0,7);c.fill();c.fillStyle='#ece6d9';c.fillRect(x-1.5,y+5,3,8);c.fillStyle='#d9826f'}}},
 {n:'Ciudad de noche',f(c){c.fillStyle=lin(c,0,0,0,BH,[[0,'#171d3a'],[.7,'#4a3d7a'],[1,'#d9826f']]);c.fillRect(0,0,BW,BH);
  c.fillStyle='#fff3c9';c.beginPath();c.arc(640,120,40,0,7);c.fill();c.fillStyle='#171d3a';c.beginPath();c.arc(655,110,36,0,7);c.fill();
  const r=rng(14);for(let i=0;i<50;i++){c.fillStyle='rgba(255,255,255,.8)';c.fillRect(r()*BW,r()*260,2,2)}
  let x=-10;while(x<BW){const w=60+r()*70,h=150+r()*260,col=r()<.5?'#232a4d':'#2e2f5a';c.fillStyle=col;c.fillRect(x,BH-h,w,h);
   for(let yy=BH-h+14;yy<BH-20;yy+=26)for(let xx=x+10;xx<x+w-14;xx+=22){c.fillStyle=r()<.55?'#f2c27a':'rgba(255,255,255,.08)';c.fillRect(xx,yy,10,14)}x+=w+4}}},
 {n:'Globos',f(c){c.fillStyle=lin(c,0,0,0,BH,[[0,'#7fb0d3'],[1,'#fbe9c6']]);c.fillRect(0,0,BW,BH);
  c.fillStyle='rgba(255,255,255,.85)';[[100,500,90],[300,540,110],[560,520,100],[760,550,90]].forEach(([x,y,r])=>{c.beginPath();c.arc(x,y,r,0,7);c.arc(x+r*.8,y+12,r*.7,0,7);c.fill()});
  const globo=(x,y,s,c1,c2)=>{c.strokeStyle='#5b4a3a';c.lineWidth=2;c.beginPath();c.moveTo(x-30*s,y+85*s);c.lineTo(x-14*s,y+140*s);c.moveTo(x+30*s,y+85*s);c.lineTo(x+14*s,y+140*s);c.stroke();
   c.fillStyle='#8a5a38';c.fillRect(x-16*s,y+140*s,32*s,22*s);
   c.fillStyle=c1;c.beginPath();c.ellipse(x,y,56*s,72*s,0,0,7);c.fill();
   c.fillStyle=c2;c.beginPath();c.ellipse(x,y,22*s,72*s,0,0,7);c.fill();
   c.fillStyle='rgba(255,255,255,.25)';c.beginPath();c.ellipse(x-20*s,y-24*s,10*s,24*s,.4,0,7);c.fill()};
  globo(220,200,1.25,'#d9826f','#f2c27a');globo(520,150,.95,'#7fc4a3','#ece6d9');globo(640,330,.7,'#e8b865','#d9826f');globo(110,400,.6,'#a58ad6','#ece6d9')}}
];
function dibujar(i,w=BW,h=BH){const k=document.createElement('canvas');k.width=w;k.height=h;const c=k.getContext('2d');c.scale(w/BW,h/BH);ESCENAS[i].f(c);return k}

/* ---------- Estado de la partida ---------- */
const NIV={e:{n:'Fácil',c:4,r:3},m:{n:'Medio',c:6,r:4},d:{n:'Difícil',c:8,r:6}};
let sel=0,lvl=localStorage.getItem('pz_lvl')||'e',foto=null,timers=[],listo=null;
const limpiar=()=>{timers.forEach(clearInterval);timers=[];if(listo){listo();listo=null}};
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

function menu(){
  limpiar();pill.textContent='0';$('#ms').textContent='';
  host.innerHTML=`<div class="pz-menu"><h3>Elige una imagen</h3><div class="pz-imgs" id="imgs"></div>
   <h3>Tamaño</h3><div class="seg" id="lv">${Object.entries(NIV).map(([k,v])=>`<button data-k="${k}" class="${k===lvl?'on':''}">${v.n} · ${v.c*v.r}</button>`).join('')}</div>
   <p class="muted">Arrastra cada pieza hasta su lugar: si queda cerca, encaja sola. Si te atoras, usa la pista.</p>
   <div class="pz-bar"><button class="btn" id="go">¡A armar!</button></div></div>`;
  const box=$('#imgs');
  ESCENAS.forEach((e,i)=>{const b=document.createElement('button');b.className='pz-img'+(i===sel&&!foto?' on':'');b.innerHTML='<span></span>';b.firstChild.textContent=e.n;b.prepend(dibujar(i,200,150));b.onclick=()=>{sel=i;foto=null;menu()};box.appendChild(b)});
  const up=document.createElement('label');up.className='pz-img pz-up'+(foto?' on':'');up.innerHTML=`<span>${foto?'Tu foto (cambiar)':'Usar mi foto'}</span><input type="file" accept="image/*">`;
  up.querySelector('input').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=document.createElement('canvas');k.width=BW;k.height=BH;const c=k.getContext('2d'),s=Math.max(BW/im.width,BH/im.height),w=im.width*s,h=im.height*s;c.drawImage(im,(BW-w)/2,(BH-h)/2,w,h);foto=k;URL.revokeObjectURL(im.src);menu()};im.onerror=()=>{$('#ms').textContent='No se pudo abrir esa imagen.'};im.src=URL.createObjectURL(f)};
  box.appendChild(up);
  $('#lv').onclick=e=>{const b=e.target.closest('button');if(!b)return;lvl=b.dataset.k;try{localStorage.setItem('pz_lvl',lvl)}catch(x){}document.querySelectorAll('#lv button').forEach(x=>x.classList.toggle('on',x===b))};
  $('#go').onclick=()=>{const im=foto||dibujar(sel);Sala.cancel();Sala.countdown(()=>jugar(im))};
}

/* ---------- Forma de las piezas ---------- */
const BORDE=[[.38,0],[.44,0,.42,.10,.40,.14],[.40,.14,.34,.26,.42,.34,.50,.34]];
function lado(p,x0,y0,dx,dy,nx,ny,L,s){            // dibuja un lado con lengüeta (s=1), hueco (s=-1) o recto (s=0)
  const P=(u,v)=>[x0+dx*u*L+nx*v*L*s*.78,y0+dy*u*L+ny*v*L*s*.78];
  if(!s){p.lineTo(x0+dx*L,y0+dy*L);return}
  p.lineTo(...P(.38,0));
  const seg=[[.44,0,.42,.10,.40,.14],[.34,.26,.42,.34,.50,.34],[.58,.34,.66,.26,.60,.14],[.58,.10,.56,0,.62,0]];
  seg.forEach(q=>p.bezierCurveTo(...P(q[0],q[1]),...P(q[2],q[3]),...P(q[4],q[5])));
  p.lineTo(x0+dx*L,y0+dy*L);
}
function trazo(pw,ph,m,b){                          // b=[arriba,derecha,abajo,izquierda]
  const p=new Path2D();p.moveTo(m,m);
  lado(p,m,m,1,0,0,-1,pw,b[0]);
  lado(p,m+pw,m,0,1,1,0,ph,b[1]);
  lado(p,m+pw,m+ph,-1,0,0,1,pw,b[2]);
  lado(p,m,m+ph,0,-1,-1,0,ph,b[3]);
  p.closePath();return p;
}

/* ---------- Juego ---------- */
function jugar(img){
  limpiar();const N=NIV[lvl],C=N.c,R=N.r,total=C*R;
  const cs=getComputedStyle(host),disp=host.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),dispW=Math.min(disp-2,680,innerHeight*.68),W=Math.max(240,Math.floor(dispW)),H=Math.round(W*BH/BW);
  const pw=W/C,ph=H/R,m=Math.ceil(Math.min(pw,ph)*.3),k=Math.min(2,window.devicePixelRatio||1);
  const bandH=Math.max(ph*2.2,Math.min(H*.85,total*pw*ph*.85/W)),MH=H+16+bandH;
  /* bordes: 1 saliente, -1 entrante, 0 recto */
  const h=[],v=[];const r=rng(Date.now()&0xfffffff);
  for(let y=0;y<R;y++){h[y]=[];for(let x=0;x<C-1;x++)h[y][x]=r()<.5?1:-1}
  for(let y=0;y<R-1;y++){v[y]=[];for(let x=0;x<C;x++)v[y][x]=r()<.5?1:-1}
  host.innerHTML=`<div class="pz-hud"><span id="hp">Piezas 0/${total}</span><span id="ht">0:00</span></div>
   <div class="pz-mesa" id="mesa" style="width:${W}px;height:${MH}px"><div class="pz-tablero" style="width:${W}px;height:${H}px"><img alt=""></div><div class="pz-bandeja" style="top:${H+16}px;width:${W}px;height:${bandH}px"></div></div>
   <div class="pz-bar" id="barra"><button class="btn ghost" id="bg">Guía</button><button class="btn ghost" id="bm">Ver modelo</button><button class="btn ghost" id="bp">Pista</button><button class="btn ghost" id="bn">Otra imagen</button></div>`;
  const mesa=$('#mesa'),url=img.toDataURL('image/jpeg',.9);$('.pz-tablero img').src=url;
  let puestas=0,pts=0,seg=0,z=10,fin=false;
  const piezas=[];
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){
    const b=[y?-(v[y-1][x]):0,x<C-1?h[y][x]:0,y<R-1?v[y][x]:0,x?-(h[y][x-1]):0];
    const cv=document.createElement('canvas'),cw=pw+2*m,ch=ph+2*m;cv.width=Math.round(cw*k);cv.height=Math.round(ch*k);cv.style.width=cw+'px';cv.style.height=ch+'px';
    const c=cv.getContext('2d');c.scale(k,k);const t=trazo(pw,ph,m,b);
    c.save();c.clip(t);c.drawImage(img,0,0,BW,BH,m-x*pw,m-y*ph,W,H);
    c.restore();c.lineJoin='round';c.lineWidth=1.6;c.strokeStyle='rgba(0,0,0,.45)';c.stroke(t);
    c.save();c.clip(t);c.lineWidth=3;c.strokeStyle='rgba(255,255,255,.22)';c.translate(1,1);c.stroke(t);c.restore();
    cv.className='pz-p';cv.dataset.i=piezas.length;
    const px=Math.random()*(W-pw)-m+ (pw/2)*0,py=H+16+Math.random()*(bandH-ph)-m+ph*.0;
    cv.style.left=Math.max(-m,Math.min(W-pw-m,px))+'px';cv.style.top=py+'px';cv.style.zIndex=piezas.length%9+1;
    mesa.appendChild(cv);piezas.push({el:cv,x,y,tx:x*pw-m,ty:y*ph-m,ok:false});
  }
  window.__pz={piezas,pw,ph,m};
  const hp=$('#hp'),ht=$('#ht');
  timers.push(setInterval(()=>{if(!fin&&!document.hidden){seg++;ht.textContent=fmt(seg)}},1000));
  /* arrastrar */
  let drag=null;
  const pos=e=>{const b=mesa.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  mesa.addEventListener('pointerdown',e=>{
    const el=e.target.closest('.pz-p');if(!el||el.classList.contains('ok'))return;
    const P=piezas[+el.dataset.i],[mx,my]=pos(e);
    drag={P,dx:mx-parseFloat(el.style.left),dy:my-parseFloat(el.style.top)};
    el.classList.add('mov');el.style.zIndex=++z;el.setPointerCapture(e.pointerId);e.preventDefault();
  });
  mesa.addEventListener('pointermove',e=>{
    if(!drag)return;const [mx,my]=pos(e),el=drag.P.el;
    el.style.left=Math.max(-m,Math.min(W-pw-m,mx-drag.dx))+'px';
    el.style.top=Math.max(-m,Math.min(MH-ph-m,my-drag.dy))+'px';
  });
  const soltar=()=>{
    if(!drag)return;const P=drag.P,el=P.el;drag=null;el.classList.remove('mov');
    const dx=parseFloat(el.style.left)-P.tx,dy=parseFloat(el.style.top)-P.ty;
    if(Math.hypot(dx,dy)<Math.max(14,Math.min(pw,ph)*.35))encajar(P);else tone(180,.05);
  };
  mesa.addEventListener('pointerup',soltar);mesa.addEventListener('pointercancel',soltar);
  function encajar(P){
    P.ok=true;P.el.style.left=P.tx+'px';P.el.style.top=P.ty+'px';P.el.classList.remove('pista');P.el.classList.add('ok');P.el.style.zIndex=1;
    puestas++;pts+=10;pill.textContent=pts;hp.textContent=`Piezas ${puestas}/${total}`;tone(440+puestas*12,.1);
    if(puestas===total)terminar();
  }
  function terminar(){
    fin=true;const bono=Math.max(0,{e:300,m:600,d:1200}[lvl]-seg)*({e:1,m:2,d:3}[lvl]);pts+=bono;
    mesa.classList.add('modelo');setTimeout(()=>{$('.pz-bandeja').remove()},50);
    $('#ms').innerHTML=`¡Completado en ${fmt(seg)}!`;
    const f=document.createElement('div');f.className='pz-fin';f.innerHTML=`<div class="big">${pts}</div><p class="muted">puntos${bono?` (incluye ${bono} de bono por tiempo)`:''}</p><div class="pz-bar"><button class="btn" id="fa">Otro rompecabezas</button></div>`;
    host.insertBefore(f,$('#barra'));$('#barra').remove();
    pill.textContent=pts;tone(784,.3);setTimeout(()=>tone(988,.4),180);Sala.confetti();
    $('#fa').onclick=menu;
  }
  $('#bg').onclick=()=>mesa.classList.toggle('singuia');
  $('#bm').onclick=()=>{mesa.classList.toggle('modelo')};
  $('#bp').onclick=()=>{const P=piezas.filter(p=>!p.ok);if(!P.length)return;const p=P[Math.floor(Math.random()*P.length)];p.el.style.zIndex=++z;p.el.classList.remove('pista');void p.el.offsetWidth;p.el.classList.add('pista');
    const g=document.createElement('div');g.style.cssText=`position:absolute;left:${p.tx+m}px;top:${p.ty+m}px;width:${pw}px;height:${ph}px;border:3px dashed var(--gold);border-radius:8px;pointer-events:none;animation:fade .3s;z-index:5`;mesa.appendChild(g);setTimeout(()=>g.remove(),1800)};
  $('#bn').onclick=menu;
  listo=()=>{};
}
addEventListener('beforeunload',limpiar);
menu();
</script></body></html>
