<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scrabble</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><meta name="description" content="Juega Scrabble gratis en Sala de Juegos."><meta name="theme-color" content="#fff1e4"><link rel="stylesheet" href="../css/sala.css"><link rel="stylesheet" href="../css/mejoras.css"><link rel="stylesheet" href="../css/movil.css"><script src="../js/sala.js"></script><script src="../js/datos.js"></script><script src="../js/palabras.js"></script></head><body><style>
.rack,.cur{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0;min-height:56px}
.tl{position:relative;width:48px;height:54px;border-radius:10px;border:0;background:linear-gradient(#f1d9a4,#d9b46c);color:#3b2a10;font:600 26px var(--head);cursor:pointer;box-shadow:0 4px 0 #8f6f33}
.tl small{position:absolute;right:5px;bottom:3px;font:700 10px var(--body)}.tl.used{opacity:.25;box-shadow:none;transform:translateY(3px)}
.cur .tl{cursor:default}
.found{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.found span{background:var(--deep);padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700}
.msg{text-align:center;min-height:24px;font-weight:700;color:var(--gold)}
</style><div class="wrap" style="--accent:#ffd8bf">
 <div class="top"><a class="back" href="../index.html">‹ Menú</a><h1>🔤 Scrabble</h1><div class="pill" id="score">0</div></div>
 <div class="panel" id="host"></div></div>
<script>
const SEL=WORDS_UP.filter(w=>w.length>=3&&w.length<=7);
const DICT=[];for(let i=0;i<1000;i++)DICT.push(SEL[Math.floor(i*SEL.length/1000)]);
const DS=new Set(DICT),BIG=DICT.filter(w=>w.length>=5);
const PT={A:1,E:1,O:1,I:1,S:1,N:1,R:1,U:1,L:1,T:1,D:2,G:2,C:3,B:3,M:3,P:3,H:4,F:4,V:4,Y:4,Q:5,J:8,X:8,Z:10};
const host=$('#host'),pill=$('#score');let timers=[];const clr=()=>{timers.forEach(clearInterval);timers=[];document.onkeydown=null};
const can=(w,r)=>{const c={};r.forEach(x=>c[x]=(c[x]||0)+1);return[...w].every(x=>(c[x]=(c[x]||0)-1)>=0)};
function menu(){clr();pill.textContent='0';
 host.innerHTML='<h3>Cómo se juega</h3><p class="muted">Forma palabras con las 7 fichas de tu mano. Cada letra vale puntos y usar las 7 fichas da +20. Tienes 150 segundos. El diccionario tiene '+fmt(DS.size)+' palabras posibles (sin tildes).</p><p class="muted">Récord: '+store.get('sc_best',0)+'</p><button class="btn" id="go">Jugar</button>';
 $('#go').onclick=()=>Sala.countdown(play);}
function hand(){const w=BIG[rnd(0,BIG.length-1)],V='AAAEEEIIOOU',Cn='SNRLTDCMPBGVH';let r=[...w];while(r.length<7)r.push(Math.random()<.4?V[rnd(0,V.length-1)]:Cn[rnd(0,Cn.length-1)]);return shuffle(r)}
function play(){clr();let rack=hand(),sel=[],score=0,used=new Set(),left=150;
 host.innerHTML='<div class="hud"><span id="h1"></span><span id="h2"></span></div><div class="cur" id="cu"></div><div class="rack" id="rk"></div><div class="msg" id="ms"></div><div style="text-align:center"><button class="btn" id="ok">Enviar</button><button class="btn ghost" id="bk">⌫ Borrar</button><button class="btn ghost" id="sh">🔀 Mezclar</button><button class="btn ghost" id="nh">Nueva mano</button></div><div class="found" id="fd"></div>';
 const tl=(c,x,i)=>'<button class="tl '+(x||'')+'"'+(i==null?'':' data-i="'+i+'"')+'>'+c+'<small>'+PT[c]+'</small></button>';
 const poss=()=>DICT.filter(w=>can(w,rack)&&!used.has(w)).length;
 function draw(){$('#cu').innerHTML=sel.map(i=>tl(rack[i])).join('')||'<span class="muted">Toca las fichas…</span>';
  $('#rk').innerHTML=rack.map((c,i)=>tl(c,sel.includes(i)?'used':'',i)).join('');
  $('#h1').textContent='⏱ '+left+' s';$('#h2').textContent='Palabras posibles en esta mano: '+poss();pill.textContent=score}
 const add=i=>{if(!sel.includes(i)){sel.push(i);tone(400+i*30,.05);draw()}};
 const send=()=>{const w=sel.map(i=>rack[i]).join('');if(w.length<3){$('#ms').textContent='Mínimo 3 letras';return}
  if(used.has(w))$('#ms').textContent='Ya la usaste';else if(!DS.has(w)){$('#ms').textContent=w+' no está en el diccionario';tone(180,.15,'square')}
  else{const p=[...w].reduce((s,c)=>s+PT[c],0)+(w.length===7?20:0);score+=p;used.add(w);$('#ms').textContent='+'+p+' puntos';tone(700,.12);$('#fd').insertAdjacentHTML('beforeend','<span>'+w+' +'+p+'</span>')}
  sel=[];draw()};
 $('#rk').onclick=e=>{const b=e.target.closest('[data-i]');if(b)add(+b.dataset.i)};
 $('#ok').onclick=send;$('#bk').onclick=()=>{sel.pop();draw()};$('#sh').onclick=()=>{rack=shuffle(rack);sel=[];draw()};$('#nh').onclick=()=>{rack=hand();sel=[];draw()};
 document.onkeydown=e=>{if(e.key==='Enter')send();else if(e.key==='Backspace'){sel.pop();draw()}else{const c=e.key.toUpperCase(),i=rack.findIndex((x,k)=>x===c&&!sel.includes(k));if(i>=0)add(i)}};
 timers.push(setInterval(()=>{left--;draw();if(left<=0)end()},1000));draw();
 function end(){clr();const b=store.get('sc_best',0);if(score>b)store.set('sc_best',score);
  host.innerHTML='<div class="res"><h2>¡Tiempo!</h2><div class="big">'+score+'</div><p class="muted">'+used.size+' palabras · Récord: '+Math.max(b,score)+'</p><button class="btn" id="a">Jugar otra vez</button><button class="btn ghost" id="b">Menú</button></div>';
  $('#a').onclick=()=>Sala.countdown(play);$('#b').onclick=menu}}
menu();
</script></body></html>
