<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Buscaminas</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><meta name="description" content="Juega Buscaminas gratis en Sala de Juegos."><meta name="theme-color" content="#fff1e4">
<link rel="stylesheet" href="../css/sala.css"><link rel="stylesheet" href="../css/mejoras.css"><link rel="stylesheet" href="../css/movil.css"><script src="../js/sala.js"></script><script src="../js/datos.js"></script></head>
<body><style>
.bm{max-width:620px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:12px}
.bm-menu{width:100%;max-width:460px}.bm-menu h3{margin:18px 0 10px}
.bm-hud{width:100%;display:flex;gap:8px;align-items:center;justify-content:space-between}
.bm-dato{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:14px;background:var(--deep);font:700 17px var(--body);min-width:86px;justify-content:center}
.bm-dato svg{width:22px;height:22px;flex:none}
.bm-wrap{position:relative;width:100%;display:flex;justify-content:center}
.bm-tab{--c:8;display:grid;grid-template-columns:repeat(var(--c),1fr);width:min(100%,calc(var(--c)*46px));border-radius:12px;overflow:hidden;background:#a2d149;box-shadow:0 8px 0 rgba(90,70,50,.22),0 0 0 3px #7aa83a;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
.c{aspect-ratio:1;display:grid;place-items:center;cursor:pointer;font:800 clamp(14px,4.4vw,24px) var(--body);-webkit-tap-highlight-color:transparent;position:relative}
.c.a{background:#aad751}.c.b{background:#a2d149}
.c.a:hover,.c.b:hover{filter:brightness(1.08)}
.c.v{cursor:default}.c.v.a{background:#e5c29f}.c.v.b{background:#d7b899}.c.v:hover{filter:none}
.c svg{width:68%;height:68%}
.c.boom{background:#e8553c!important}
.c.mal::after{content:"";position:absolute;inset:12%;background:linear-gradient(45deg,transparent 44%,#e53935 44%,#e53935 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#e53935 44%,#e53935 56%,transparent 56%)}
.n1{color:#1976d2}.n2{color:#388e3c}.n3{color:#d32f2f}.n4{color:#7b1fa2}.n5{color:#e08a00}.n6{color:#0097a7}.n7{color:#424242}.n8{color:#8d8d8d}
.bm-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.bm-bar .btn{margin:0;padding:10px 18px;font-size:14px}
.bm-bar .on{background:var(--accent);color:#2b3a12}
.bm-bar svg{width:18px;height:18px;vertical-align:-3px;margin-right:5px}
.bm-ov{position:absolute;inset:-6px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:14px;background:rgba(255,250,246,.93);border-radius:16px;z-index:5;animation:fade .4s}
.bm-ov.on{display:flex}.bm-ov h2{margin:0;font:600 clamp(28px,8vw,40px) var(--head)}.bm-ov .big{font:600 clamp(44px,13vw,64px)/1.05 var(--head)}
.bm-ov.gana h2,.bm-ov.gana .big{color:#2e9e63}.bm-ov.pierde h2,.bm-ov.pierde .big{color:#d9473a}.bm-ov p{margin:0;color:var(--muted);font-size:14.5px}.bm-ov .bm-bar{margin-top:12px}
.msg{text-align:center;min-height:24px;font-weight:700;color:#c9705a;margin:0}
.pista-bm{color:var(--muted);font-size:13.5px;text-align:center;margin:0}
</style>
<div class="wrap" style="--accent:#aad751">
 <div class="top"><a class="back" href="../index.html">‹ Menú</a><h1><img class="gi" src="../img/buscaminas.svg" alt=""><span>Buscaminas</span></h1><div class="pill" id="score">0</div></div>
 <div class="panel" id="host"></div>
 <p class="msg" id="ms" role="status"></p>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s),pill=$('#score'),host=$('#host');
let _ac=null;const tono=(f,d=.07,t='triangle',v=.07,f2)=>{try{const C=window.AudioContext||window.webkitAudioContext;_ac=_ac||new C();if(_ac.state==='suspended')_ac.resume();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.setValueAtTime(f,_ac.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,_ac.currentTime+d);g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d)}catch(e){}};
/* ---------- Íconos (SVG) ---------- */
const MINA='<svg viewBox="0 0 24 24" aria-hidden="true"><g stroke="#2b2622" stroke-width="2" stroke-linecap="round"><path d="M12 2.500v4M12 17.500v4M2.500 12h4M17.500 12h4M5.300 5.300l2.800 2.800M15.900 15.900l2.800 2.800M18.700 5.300l-2.800 2.800M8.100 15.900l-2.800 2.800"/></g><circle cx="12" cy="12" r="6.500" fill="#2b2622"/><circle cx="10" cy="10" r="1.900" fill="#fff" fill-opacity=".85"/></svg>';
const BAND='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18M4.500 21h5" stroke="#4a3426" stroke-width="2.200" stroke-linecap="round" fill="none"/><path d="M7.600 3.800l11 4.600-11 4.600z" fill="#e53935"/></svg>';
const RELOJ='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#7a5230" stroke-width="2.200" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 8.500V13l3 2M9.500 3h5"/></svg>';
const NIV={1:{n:'Fácil',c:8,f:10,m:10,base:400,t:120},2:{n:'Medio',c:10,f:14,m:28,base:900,t:300},3:{n:'Difícil',c:12,f:18,m:50,base:1800,t:600}};
let nivel=+(localStorage.getItem('bm_niv')||1),G=null,timer=0,pressT=0,longDone=0,modoBand=false;

function menu(){
  clearInterval(timer);$('#ms').textContent='';pill.textContent='0';
  host.innerHTML=`<div class="bm"><div class="bm-menu"><h3>Dificultad</h3>
   <div class="seg" id="sN">${[1,2,3].map(k=>`<button data-v="${k}" class="${k===nivel?'on':''}">${NIV[k].n}</button>`).join('')}</div>
   <p class="muted" id="det"></p>
   <p class="muted">Toca una casilla para abrirla. Los números dicen cuántas minas hay alrededor. En computadora usa clic derecho para poner una bandera; en teléfono, mantén presionada la casilla o activa el botón Bandera. Tu primer toque siempre es seguro.</p>
   <div class="bm-bar" style="margin-top:8px"><button class="btn" id="go">¡A jugar!</button></div></div></div>`;
  const det=()=>{const c=NIV[nivel];$('#det').textContent=`${c.c} × ${c.f} casillas · ${c.m} minas`};det();
  $('#sN').onclick=e=>{const b=e.target.closest('button');if(!b)return;nivel=+b.dataset.v;localStorage.setItem('bm_niv',nivel);document.querySelectorAll('#sN button').forEach(x=>x.classList.toggle('on',x===b));det()};
  $('#go').onclick=empezar;
}
function empezar(){Sala.cancel();Sala.countdown(_empezar)}
function _empezar(){
  const c=NIV[nivel],n=c.c*c.f;
  G={c:c.c,f:c.f,m:c.m,n,mina:new Uint8Array(n),num:new Uint8Array(n),ab:new Uint8Array(n),ban:new Uint8Array(n),ini:false,fin:false,gano:false,seg:0,abiertas:0,t0:0,boom:-1};
  modoBand=false;pill.textContent='0';$('#ms').textContent='';
  host.innerHTML=`<div class="bm"><div class="bm-hud"><div class="bm-dato">${MINA}<span id="mi"></span></div><div class="bm-dato">${RELOJ}<span id="tm">0</span></div><button class="btn ghost" id="bBan" style="margin:0;padding:9px 14px" aria-pressed="false">${BAND.replace('<svg','<svg style="width:20px;height:20px;vertical-align:-4px;margin-right:4px"')}Bandera</button></div>
   <div class="bm-wrap"><div class="bm-tab" id="tab" style="--c:${G.c}" role="grid" aria-label="Campo de minas"></div><div class="bm-ov" id="ov"></div></div>
   <div class="bm-bar"><button class="btn ghost" id="bNue">Nueva partida</button><button class="btn ghost" id="bMen">Cambiar dificultad</button><button class="btn ghost" id="bRes" hidden>Ver resultado</button></div></div>`;
  const tab=$('#tab');
  tab.addEventListener('pointerdown',e=>{const x=e.target.closest('.c');if(!x||G.fin)return;longDone=0;clearTimeout(pressT);if(e.pointerType!=='mouse')pressT=setTimeout(()=>{longDone=Date.now();alterna(+x.dataset.i);if(navigator.vibrate)navigator.vibrate(25)},420)});
  ['pointerup','pointerleave','pointercancel','pointermove'].forEach(ev=>tab.addEventListener(ev,e=>{if(ev==='pointermove'&&e.pointerType==='mouse')return;clearTimeout(pressT)}));
  tab.addEventListener('click',e=>{const x=e.target.closest('.c');if(!x||G.fin)return;if(longDone&&Date.now()-longDone<900){return}const i=+x.dataset.i;modoBand?alterna(i):abre(i)});
  tab.addEventListener('contextmenu',e=>{e.preventDefault();const x=e.target.closest('.c');if(!x||G.fin)return;if(longDone&&Date.now()-longDone<900)return;alterna(+x.dataset.i)});
  $('#bBan').onclick=()=>{modoBand=!modoBand;$('#bBan').classList.toggle('on',modoBand);$('#bBan').setAttribute('aria-pressed',modoBand)};
  $('#bNue').onclick=empezar;$('#bMen').onclick=menu;$('#bRes').onclick=()=>$('#ov').classList.add('on');
  pintar();
}
const vecinos=i=>{const r=Math.floor(i/G.c),c=i%G.c,o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&rr<G.f&&cc>=0&&cc<G.c)o.push(rr*G.c+cc)}return o};
function colocarMinas(seguro){
  const veto=new Set([seguro,...vecinos(seguro)]);let p=0;
  while(p<G.m){const k=Math.floor(Math.random()*G.n);if(G.mina[k]||veto.has(k))continue;G.mina[k]=1;p++}
  for(let i=0;i<G.n;i++)G.num[i]=vecinos(i).reduce((s,k)=>s+G.mina[k],0);
}
function abre(i){
  if(G.ban[i])return;
  if(G.ab[i]){ // acorde: abrir alrededor si ya hay tantas banderas como minas
    if(!G.num[i])return;const v=vecinos(i);if(v.filter(k=>G.ban[k]).length!==G.num[i])return;
    v.forEach(k=>{if(!G.ban[k]&&!G.ab[k]&&!G.fin)abrirCelda(k)});revisa();return;
  }
  if(!G.ini){G.ini=true;colocarMinas(i);G.t0=Date.now();timer=setInterval(()=>{G.seg=Math.floor((Date.now()-G.t0)/1000);const t=$('#tm');if(t)t.textContent=G.seg},250)}
  abrirCelda(i);revisa();
}
function abrirCelda(i){
  if(G.mina[i]){G.boom=i;return perder()}
  const pila=[i];
  while(pila.length){const k=pila.pop();if(G.ab[k]||G.ban[k])continue;G.ab[k]=1;G.abiertas++;if(!G.num[k])vecinos(k).forEach(z=>{if(!G.ab[z]&&!G.ban[z])pila.push(z)})}
  pill.textContent=G.abiertas;tono(380+Math.min(G.abiertas,40)*6,.05,'triangle',.05);
}
function alterna(i){
  if(G.ab[i]||G.fin)return;
  G.ban[i]^=1;tono(G.ban[i]?640:420,.05,'square',.04);pintar();
}
function revisa(){if(!G.fin&&G.abiertas===G.n-G.m)ganar();else pintar()}
function pintar(){
  const tab=$('#tab');let h='';
  for(let i=0;i<G.n;i++){
    const r=Math.floor(i/G.c),c=i%G.c,chk=(r+c)%2?'b':'a';let cl='c '+chk,txt='';
    if(G.ab[i]){cl+=' v';if(G.num[i])txt=`<span class="n${G.num[i]}">${G.num[i]}</span>`}
    else if(G.fin&&G.mina[i]&&!G.ban[i]){txt=MINA;cl+=' v'}
    else if(G.ban[i]){txt=BAND;if(G.fin&&!G.mina[i])cl+=' mal'}
    if(G.boom===i)cl+=' boom';
    h+=`<div class="${cl}" data-i="${i}" role="gridcell">${txt}</div>`;
  }
  tab.innerHTML=h;
  $('#mi').textContent=Math.max(0,G.m-G.ban.reduce((s,x)=>s+x,0));
}
function cierra(){clearInterval(timer);G.fin=true;G.seg=G.ini?Math.floor((Date.now()-G.t0)/1000):0}
function ganar(){
  cierra();G.gano=true;for(let i=0;i<G.n;i++)if(G.mina[i])G.ban[i]=1;
  const c=NIV[nivel],bono=c.base+Math.max(0,c.t-G.seg)*(nivel*2),total=G.abiertas+bono;pill.textContent=total;
  let mejor=0;const k='bm_best'+nivel;try{mejor=+localStorage.getItem(k)||0;if(!mejor||G.seg<mejor){mejor=G.seg;localStorage.setItem(k,G.seg)}}catch(e){}
  $('#ms').textContent='¡Completado: campo despejado!';pintar();Sala.confetti();tono(784,.2);setTimeout(()=>tono(988,.3),180);
  resultado('gana','¡Ganaste!',`Despejaste el campo en ${G.seg} s`,total,`${c.n} · incluye ${bono} de bono · mejor tiempo: ${mejor} s`);
}
function perder(){
  cierra();pintar();tono(160,.6,'sawtooth',.08,50);
  $('#ms').textContent='¡Boom! Pisaste una mina.';
  resultado('pierde','¡Boom!','Pisaste una mina',G.abiertas,`${NIV[nivel].n} · casillas abiertas: ${G.abiertas} de ${G.n-G.m}`);
}
function resultado(cl,titulo,sub,pts,det){
  const ov=$('#ov');ov.className='bm-ov '+cl;
  ov.innerHTML=`<h2>${titulo}</h2><p>${sub}</p><div class="big">${pts}</div><p>puntos</p><p>${det}</p><div class="bm-bar"><button class="btn" id="ovOtra" style="background:var(--accent);color:#2b3a12">Jugar otra vez</button><button class="btn ghost" id="ovVer">Ver tablero</button></div>`;
  $('#bRes').hidden=false;
  setTimeout(()=>{if(!G.fin)return;ov.classList.add('on');$('#ovOtra').onclick=empezar;$('#ovVer').onclick=()=>ov.classList.remove('on')},cl==='gana'?700:900);
}
window.__bm={get G(){return G},abre,alterna,empezar,get nivel(){return nivel}};
menu();
})();
</script></body></html>
