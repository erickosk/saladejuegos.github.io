<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ajedrez</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><meta name="description" content="Juega Ajedrez gratis en Sala de Juegos."><meta name="theme-color" content="#fff1e4">
<link rel="stylesheet" href="../css/sala.css"><link rel="stylesheet" href="../css/mejoras.css"><link rel="stylesheet" href="../css/movil.css"><script src="../js/sala.js"></script><script src="../js/datos.js"></script><script src="../js/ajedrez-motor.js"></script></head>
<body><style>
.aj{max-width:600px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:12px}
.aj-menu{width:100%;max-width:440px}
.aj-menu h3{margin:18px 0 10px}
.aj-estado{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;padding:10px 14px;border-radius:14px;background:var(--deep);min-height:44px}
.aj-estado .pens{display:inline-block;animation:pulso 1s infinite}
@keyframes pulso{50%{opacity:.4}}
.aj-cap{width:100%;display:flex;gap:2px;flex-wrap:wrap;min-height:22px;align-items:center}
.aj-cap svg{width:22px;height:22px;margin-right:-5px}
.aj-cap b{font-size:12px;color:var(--muted);margin-left:10px}
.aj-wrap{position:relative;width:min(100%,560px,calc(100vh - 330px));width:min(100%,560px,calc(100dvh - 330px));min-width:290px}
.aj-tab{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1;border-radius:12px;overflow:hidden;box-shadow:0 8px 0 rgba(105,65,35,.22),0 0 0 3px #7a5230;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sq{position:relative;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sq.c{background:#f0d9b5}.sq.o{background:#b58863}
.sq.ult::before{content:"";position:absolute;inset:0;background:rgba(255,226,70,.5)}
.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(130,200,90,.65)}
.sq.jaque::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(230,50,40,.9) 0,rgba(230,50,40,.5) 45%,transparent 75%)}
.sq.pista::after{content:"";position:absolute;inset:3px;border:3px dashed #2e8b3a;border-radius:8px;animation:pulso 1s infinite}
.sq.mov::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(40,110,50,.4)}
.sq.cap::after{content:"";position:absolute;inset:4%;border-radius:50%;border:5px solid rgba(40,110,50,.4)}
.sq svg{position:relative;z-index:1;width:88%;height:88%;filter:drop-shadow(0 2px 1px rgba(67,42,23,.35));pointer-events:none}
.sq.nuevo svg{animation:pop .25s var(--ease)}
.sq i{position:absolute;font:700 10px var(--body);font-style:normal;color:rgba(74,38,38,.55);z-index:1;pointer-events:none}
.sq i.f{right:3px;bottom:1px}.sq i.r{left:3px;top:1px}
.aj-ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:14px;background:rgba(255,250,246,.93);border-radius:12px;z-index:6;animation:fade .4s}
.aj-ov.on{display:flex}
.aj-ov h2{margin:0;font:600 clamp(26px,7vw,38px) var(--head);color:var(--text)}
.aj-ov .big{font:600 clamp(44px,13vw,64px)/1.05 var(--head);color:var(--accent)}
.aj-ov.gana h2,.aj-ov.gana .big{color:#2e9e63}.aj-ov.pierde h2{color:#d9473a}.aj-ov.tablas h2{color:#c98a2a}
.aj-ov p{margin:0;color:var(--muted);font-size:14.5px}
.aj-ov .aj-bar{margin-top:12px}.aj-ov .aj-bar .btn{margin:0}
.aj-prom{position:absolute;inset:0;display:none;place-items:center;background:rgba(255,250,246,.88);border-radius:12px;z-index:5}
.aj-prom.on{display:grid}
.aj-prom div{display:flex;gap:8px;padding:14px;background:var(--panel);border-radius:18px;box-shadow:0 10px 30px rgba(105,65,35,.3)}
.aj-prom button{width:64px;height:64px;border:0;border-radius:14px;background:var(--peach);cursor:pointer;padding:4px}
.aj-prom button:hover{background:var(--salmon)}
.aj-prom svg{width:100%;height:100%}
.aj-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.aj-bar .btn{margin:0;padding:10px 18px;font-size:14px}
.aj-lista{width:100%;max-height:110px;overflow:auto;background:var(--deep);border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.7;color:var(--muted)}
.aj-lista b{color:var(--text);font-weight:700}
.msg{text-align:center;min-height:24px;font-weight:700;color:#d9405f;margin:0}
</style>
<div class="wrap" style="--accent:#f6ac69">
 <div class="top"><a class="back" href="../index.html">‹ Menú</a><h1><img class="gi" src="../img/ajedrez.svg" alt=""><span>Ajedrez</span></h1><div class="pill" id="score">0</div></div>
 <div class="panel" id="host"></div>
 <p class="msg" id="ms" role="status"></p>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s),pill=$('#score'),host=$('#host'),A=Ajedrez;
let _ac=null;const tono=(f,d=.08,v=.08)=>{try{const C=window.AudioContext||window.webkitAudioContext;_ac=_ac||new C();if(_ac.state==='suspended')_ac.resume();const o=_ac.createOscillator(),g=_ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d)}catch(e){}};
/* ---------- Piezas dibujadas (SVG propio) ---------- */
const FORMA={
 1:'<circle cx="22.5" cy="12.5" r="5.5"/><path d="M17.5 20.5h10c0 6 4.5 8 4.5 14H13c0-6 4.500-8 4.500-14z"/><path d="M11.500 34.500h22v4h-22z"/>',
 4:'<path d="M11 38.500h23v-4H11z"/><path d="M13.500 34.500h18l-1.500-13h-15z"/><path d="M12 9.500h5v4h3.500v-4h4v4H28v-4h5V19H12z"/><path d="M14 19h17l-.8 2.500H14.800z"/>',
 2:'<path d="M12 38.500V34Q12 26 19 21Q15 20 14 15L19 8.500L18.500 4.500L24 8Q35 9 37 22L36 38.500Z"/><circle cx="22" cy="13.500" r="1.500" fill="#4a2626" stroke="none"/><path d="M24 8Q28.500 14 27.500 22" fill="none"/>',
 3:'<circle cx="22.500" cy="7.500" r="3"/><path d="M22.500 10.500Q31 16 29 25Q28.500 28 31 31V33H14V31Q16.500 28 16 25Q14 16 22.500 10.500z"/><path d="M11.500 33h22v5h-22z"/><path d="M19.500 20h6M22.500 17v6" fill="none"/>',
 5:'<path d="M11.500 38.500h22v-4h-22z"/><path d="M12.500 34.500L9.500 15L16 25L17.500 12L22.500 24L27.500 12L29 25L35.500 15L32.500 34.500Z"/><circle cx="9.500" cy="13" r="2.500"/><circle cx="17.500" cy="10" r="2.500"/><circle cx="22.500" cy="8.500" r="2.500"/><circle cx="27.500" cy="10" r="2.500"/><circle cx="35.500" cy="13" r="2.500"/>',
 6:'<path d="M21 3.500h3v4h4v3h-4v4h-3v-4h-4v-3h4z"/><path d="M22.500 14.500c9 0 14.500 5.500 12.500 13l-2 7H12l-2-7c-2-7.500 3.500-13 12.500-13z"/><path d="M11 34.500h23v4H11z"/>'};
const pieza=(p,cls='')=>{const t=p&7,c=p>>3;return `<svg viewBox="0 0 45 45" class="${cls}" aria-hidden="true"><g fill="${c?'#1d242b':'#fffaf3'}" stroke="#4a2626" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">${FORMA[t]}</g></svg>`};
const NOMBRE={1:'peón',2:'caballo',3:'alfil',4:'torre',5:'dama',6:'rey'};
const VALOR={1:1,2:3,3:3,4:5,5:9,6:0};

/* ---------- Estado ---------- */
let g,humano=0,nivel=2,sel=-1,movs=[],ult=null,pista=null,pensando=false,fin=false,puntos=0,promo=null;
let capturas=[[],[]],pilaScore=[],lista=[],opcColor='w',opcNivel=2;
const set=n=>{puntos=n;pill.textContent=n};

function menu(){
  clearTimeout(tIA);pensando=false;
  $('#ms').textContent='';set(0);
  host.innerHTML=`<div class="aj"><div class="aj-menu"><h3>Juegas con</h3>
   <div class="seg" id="sColor"><button data-v="w" class="${opcColor==='w'?'on':''}">Blancas</button><button data-v="b" class="${opcColor==='b'?'on':''}">Negras</button><button data-v="r" class="${opcColor==='r'?'on':''}">Al azar</button></div>
   <h3>Dificultad de la computadora</h3>
   <div class="seg" id="sNivel"><button data-v="1" class="${opcNivel===1?'on':''}">Fácil</button><button data-v="2" class="${opcNivel===2?'on':''}">Medio</button><button data-v="3" class="${opcNivel===3?'on':''}">Difícil</button></div>
   <p class="muted">Toca una pieza y luego la casilla a la que quieras moverla. Los puntos rojos te muestran a dónde puede ir. Ganas puntos por cada pieza que captures y un bono grande si das jaque mate.</p>
   <div class="aj-bar" style="margin-top:8px"><button class="btn" id="go">¡A jugar!</button></div></div></div>`;
  $('#sColor').onclick=e=>{const b=e.target.closest('button');if(!b)return;opcColor=b.dataset.v;document.querySelectorAll('#sColor button').forEach(x=>x.classList.toggle('on',x===b))};
  $('#sNivel').onclick=e=>{const b=e.target.closest('button');if(!b)return;opcNivel=+b.dataset.v;document.querySelectorAll('#sNivel button').forEach(x=>x.classList.toggle('on',x===b))};
  $('#go').onclick=()=>empezar();
}
function empezar(){Sala.cancel();Sala.countdown(_empezar)}
function _empezar(){
  humano=opcColor==='r'?(Math.random()<.5?0:1):(opcColor==='w'?0:1);nivel=opcNivel;
  g=new A.Partida();sel=-1;movs=[];ult=null;pista=null;pensando=false;fin=false;promo=null;capturas=[[],[]];pilaScore=[];lista=[];set(0);$('#ms').textContent='';
  host.innerHTML=`<div class="aj"><div class="aj-estado"><span id="est"></span><span style="color:var(--muted);font-size:13px">${['','Fácil','Medio','Difícil'][nivel]} · ${humano?'Negras':'Blancas'}</span></div>
   <div class="aj-cap" id="cap1"></div>
   <div class="aj-wrap"><div class="aj-tab" id="tab" role="grid" aria-label="Tablero de ajedrez"></div><div class="aj-prom" id="prom"></div><div class="aj-ov" id="ov" role="dialog" aria-live="polite"></div></div>
   <div class="aj-cap" id="cap0"></div>
   <div class="aj-bar"><button class="btn ghost" id="bDes">Deshacer</button><button class="btn ghost" id="bPis">Pista</button><button class="btn ghost" id="bNue">Nueva partida</button><button class="btn ghost" id="bRes" hidden>Ver resultado</button></div>
   <div class="aj-lista" id="lis">Aquí aparecerán las jugadas.</div></div>`;
  $('#tab').addEventListener('click',e=>{const q=e.target.closest('.sq');if(q)tocar(+q.dataset.s)});
  $('#bRes').onclick=()=>$('#ov').classList.add('on');$('#bDes').onclick=deshacer;$('#bPis').onclick=darPista;$('#bNue').onclick=menu;
  pintar();
  if(g.lado!==humano)turnoIA();
}

/* ---------- Dibujo ---------- */
function pintar(){
  const tab=$('#tab');let h='';
  const filas=humano?[0,1,2,3,4,5,6,7]:[7,6,5,4,3,2,1,0],cols=humano?[7,6,5,4,3,2,1,0]:[0,1,2,3,4,5,6,7];
  const rey=g.enJaque()?g.rey[g.lado]:-1;
  for(let ri=0;ri<8;ri++)for(let ci=0;ci<8;ci++){
    const r=filas[ri],c=cols[ci],s=r*16+c,p=g.b[s],claro=(r+c)%2===1;
    const m=movs.find(x=>A.mTo(x)===s);
    let cl='sq '+(claro?'c':'o');
    if(ult&&(s===ult[0]||s===ult[1]))cl+=' ult';if(s===sel)cl+=' sel';if(s===rey)cl+=' jaque';if(pista&&(s===pista[0]||s===pista[1]))cl+=' pista';
    if(m)cl+=p||(A.mFlags(m)&A.F_EP)?' cap':' mov';
    if(ult&&s===ult[1])cl+=' nuevo';
    h+=`<div class="${cl}" data-s="${s}" role="gridcell" aria-label="${A.sqName(s)}${p?' '+NOMBRE[p&7]+(p>>3?' negro':' blanco'):''}">${p?pieza(p):''}${ci===0?`<i class="r">${r+1}</i>`:''}${ri===7?`<i class="f">${'abcdefgh'[c]}</i>`:''}</div>`;
  }
  tab.innerHTML=h;
  const est=$('#est');
  if(!fin){const j=g.enJaque();est.innerHTML=pensando?'<span class="pens">La computadora piensa…</span>':(g.lado===humano?(j?'¡Jaque! Es tu turno':'Tu turno'):'Turno de la computadora');}
  ['0','1'].forEach(k=>{$('#cap'+k).innerHTML=capturas[+k].map(p=>pieza(p)).join('')+(adv(+k)>0?`<b>+${adv(+k)}</b>`:'')});
  const L=$('#lis');if(lista.length){let o='';for(let i=0;i<lista.length;i+=2)o+=`<b>${i/2+1}.</b> ${lista[i]}  ${lista[i+1]||''}  `;L.innerHTML=o;L.scrollTop=L.scrollHeight}
  $('#bDes').disabled=pensando||!puedeDeshacer();$('#bPis').disabled=pensando||fin||g.lado!==humano;
}
const adv=k=>{const a=capturas[k].reduce((s,p)=>s+VALOR[p&7],0),b=capturas[k^1].reduce((s,p)=>s+VALOR[p&7],0);return a-b};

/* ---------- Jugar ---------- */
function tocar(s){
  if(fin||pensando||promo||g.lado!==humano)return;
  pista=null;
  const m=movs.find(x=>A.mTo(x)===s);
  if(sel>=0&&m){
    if(A.mPromo(m)){promo={f:sel,t:s};abrirPromo();return}
    ejecutar(m);return;
  }
  const p=g.b[s];
  if(p&&(p>>3)===humano){sel=s;movs=g.movsDesde(s);tono(520,.04,.05)}else{sel=-1;movs=[]}
  pintar();
}
function abrirPromo(){
  const el=$('#prom');el.innerHTML='<div>'+[5,4,3,2].map(t=>`<button data-t="${t}" aria-label="${NOMBRE[t]}">${pieza(t|(humano<<3))}</button>`).join('')+'</div>';el.classList.add('on');
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const m=g.buscarMov(promo.f,promo.t,+b.dataset.t);promo=null;el.classList.remove('on');if(m)ejecutar(m)};
}
function ejecutar(m,porIA=false){
  const f=A.mFrom(m),t=A.mTo(m),p=g.b[f],quien=g.lado,cap=(A.mFlags(m)&A.F_EP)?(1|((quien^1)<<3)):g.b[t];
  pilaScore.push({score:puntos,cap:cap?quien:-1,lista:lista.length});
  const txt=nombreMov(p,f,t,cap,m);
  g.jugar(m);
  if(cap)capturas[quien].push(cap);
  lista.push(txt);
  ult=[f,t];sel=-1;movs=[];
  if(!porIA)set(puntos+1+(cap?VALOR[cap&7]*10:0));
  tono(cap?240:420,cap?.12:.06,.09);
  const est=g.estado();
  if(est){terminar(est);pintar();return}
  pintar();
  if(g.lado!==humano)turnoIA();
}
const LETRA={2:'C',3:'A',4:'T',5:'D',6:'R'},LPROM={5:'D',4:'T',3:'A',2:'C'};
function nombreMov(p,f,t,cap,m){
  if(A.mFlags(m)&A.F_ENR)return (t&4)?'O-O':'O-O-O';
  return (LETRA[p&7]||'')+A.sqName(f)+(cap?'x':'–')+A.sqName(t)+(A.mPromo(m)?'='+LPROM[A.mPromo(m)]:'');
}
function mostrarResultado(est,gano,bono){
  const mate=est==='mate';let mejor=0,clave='aj_best'+nivel;
  try{mejor=+localStorage.getItem(clave)||0;if(gano&&puntos>mejor){mejor=puntos;localStorage.setItem(clave,puntos)}}catch(e){}
  const razon={ahorcado:'',ahogado:'Rey ahogado: no hay jugadas legales.',repeticion:'Repetición de posición.','50':'Regla de los 50 movimientos.',material:'No hay material suficiente para dar mate.'}[est]||'';
  const jug=Math.ceil(lista.length/2),cl=gano?'gana':mate?'pierde':'tablas';
  const ov=$('#ov');ov.className='aj-ov '+cl;
  ov.innerHTML=`<h2>${gano?'¡Ganaste!':mate?'Perdiste':'¡Tablas!'}</h2><p>${mate?(gano?'Jaque mate a la computadora':'Jaque mate: ganó la computadora'):razon}</p>
   <div class="big">${puntos}</div><p>puntos${gano&&bono?` (incluye ${bono} de bono)`:''}</p>
   <p>${jug} ${jug===1?'jugada':'jugadas'} · nivel ${['','fácil','medio','difícil'][nivel]}${gano&&mejor?' · tu récord: '+mejor:''}</p>
   <div class="aj-bar"><button class="btn" id="ovOtra" style="background:var(--accent)">Jugar otra vez</button><button class="btn ghost" id="ovVer">Ver tablero</button></div>`;
  $('#bRes').hidden=false;
  setTimeout(()=>{if(!fin)return;ov.classList.add('on');const b=$('#ovOtra');if(b){b.onclick=()=>empezar();$('#ovVer').onclick=()=>ov.classList.remove('on')}},mate?900:600);
}
let tIA=0;
function turnoIA(){
  pensando=true;pintar();
  tIA=setTimeout(()=>{
    if(!pensando)return;
    const m=g.elegir(nivel,[0,500,900,1500][nivel]);pensando=false;
    if(m)ejecutar(m,true);
  },350);
}
function terminar(est){
  fin=true;let bono=0,msg='';
  const mate=est==='mate',ganoHumano=mate&&g.lado!==humano;
  if(mate){
    if(ganoHumano){bono=[0,300,600,1000][nivel]+Math.max(0,60-Math.floor(lista.length/2))*5;set(puntos+bono);msg=`¡Completado: jaque mate! Ganaste (+${bono} puntos)`;Sala.confetti();tono(784,.2);setTimeout(()=>tono(988,.3),180)}
    else{msg='Jaque mate: ganó la computadora. ¡Revancha!';tono(160,.5)}
  }else msg={ahogado:'Tablas por rey ahogado (no hay jugadas legales).',repeticion:'Tablas por repetición de posición.','50':'Tablas por la regla de los 50 movimientos.',material:'Tablas: no hay material suficiente para dar mate.'}[est];
  $('#est').textContent=mate?(ganoHumano?'¡Ganaste!':'Perdiste'):'Tablas';
  $('#ms').textContent=msg;
  mostrarResultado(est,ganoHumano,bono);
}
const minPila=()=>humano?1:0;
function puedeDeshacer(){return pilaScore.length>minPila()}
function deshacer(){
  if(pensando||!puedeDeshacer())return;
  let n=g.lado===humano?2:1;
  while(n>0&&pilaScore.length>minPila()){
    g.retroceder();const u=pilaScore.pop();set(u.score);if(u.cap>=0)capturas[u.cap].pop();lista.length=u.lista;n--;
  }
  fin=false;sel=-1;movs=[];pista=null;ult=null;$('#ms').textContent='';$('#ov').classList.remove('on');$('#bRes').hidden=true;
  pintar();
}
function darPista(){
  if(fin||pensando||g.lado!==humano)return;
  const b=$('#bPis');b.disabled=true;b.textContent='Pensando…';
  setTimeout(()=>{const m=g.elegir(3,700);b.textContent='Pista';if(m){pista=[A.mFrom(m),A.mTo(m)];sel=-1;movs=[];pintar();setTimeout(()=>{pista=null;if(!fin)pintar()},3500)}},30);
}
window.__aj={get g(){return g},get humano(){return humano},tocar,get fin(){return fin},get pensando(){return pensando},empezar,get puntos(){return puntos},set opc(v){opcColor=v}};
menu();
})();
</script></body></html>
