<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pacman</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><meta name="description" content="Juega Pacman gratis en Sala de Juegos."><meta name="theme-color" content="#fff1e4">
<link rel="stylesheet" href="../css/sala.css"><link rel="stylesheet" href="../css/mejoras.css"><link rel="stylesheet" href="../css/movil.css"><script src="../js/sala.js"></script><script src="../js/datos.js"></script></head>
<body><style>
.pc{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.pc-cv{position:relative;width:min(100%,560px,calc((100vh - 270px)*19/21));width:min(100%,560px,calc((100dvh - 270px)*19/21));min-width:260px;line-height:0}
#cv{width:100%;height:auto;aspect-ratio:19/21;border-radius:14px;background:#171d23;touch-action:none;display:block}
.pc-ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.4;background:rgba(23,29,35,.82);border-radius:14px;animation:fade .3s}
.pc-ov.on{display:flex}
.pc-ov h2{margin:0;font:600 32px var(--head);color:var(--text)}.pc-ov .big{font:600 56px/1.1 var(--head);color:var(--accent)}.pc-ov p{margin:0;color:var(--muted)}
.pc-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.pc-bar .btn{margin:0;min-height:42px;padding:9px 18px;font-size:15px}
.pc-dpad{display:none;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,64px);gap:6px;justify-content:center;margin-top:2px}
.pc-dpad button{border:0;border-radius:18px;background:var(--panel2);color:var(--text);box-shadow:0 4px 0 rgba(0,0,0,.3);display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none}
.pc-dpad button:active,.pc-dpad button.on{background:var(--accent);color:var(--ink);transform:translateY(3px);box-shadow:0 1px 0 rgba(105,65,35,.3)}
.pc-dpad svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pc-dpad .u{grid-area:1/2}.pc-dpad .l{grid-area:2/1}.pc-dpad .r{grid-area:2/3}.pc-dpad .d{grid-area:3/2}
@media(pointer:coarse),(max-width:700px){.pc-dpad{display:grid}}
.msg{text-align:center;min-height:24px;font-weight:700;color:var(--gold);margin:0}
</style>
<div class="wrap" style="--accent:#ffd54a">
 <div class="top"><a class="back" href="../index.html">‹ Menú</a><h1><img class="gi" src="../img/pacman.svg" alt=""><span>Pacman</span></h1><div class="pill" id="scorePill">0</div></div>
 <div class="panel game-host" id="gameHost"><div class="pc">
  <div class="pc-cv"><canvas id="cv" aria-label="Laberinto de Pacman"></canvas>
   <div class="pc-ov" id="ov"></div></div>
  <div class="pc-dpad" id="dp"><button class="u" data-d="0" aria-label="Arriba"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></button><button class="l" data-d="1" aria-label="Izquierda"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button class="r" data-d="3" aria-label="Derecha"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button><button class="d" data-d="2" aria-label="Abajo"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button></div>
  <div class="pc-bar"><button class="btn ghost" id="bPausa">Pausa</button><button class="btn ghost" id="bSon">Sonido: sí</button></div>
 </div></div>
 <p id="ms" class="msg" role="status"></p>
 <p id="gameInfo" class="game-info"></p>
 <div style="text-align:center"><button class="btn ghost" id="replay">Ver instrucciones</button></div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s),pill=$('#scorePill'),cv=$('#cv'),ctx=cv.getContext('2d');
/* ---------- Mapa (19 × 21). # pared · - puerta de la casa · . punto · o píldora · P inicio ---------- */
const MAP=[
"###################",
"#........#........#",
"#o##.###.#.###.##o#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#...#...#....#",
"####.### # ###.####",
"   #.#       #.#   ",
"####.# ##-## #.####",
"    .  #   #  .    ",
"####.# ##### #.####",
"   #.#       #.#   ",
"####.# ##### #.####",
"#........#........#",
"#.##.###.#.###.##.#",
"#o.#.....P.....#.o#",
"##.#.#.#####.#.#.##",
"#....#...#...#....#",
"#.######.#.######.#",
"#.................#",
"###################"];
const W=19,H=21,T=24,K=Math.min(2,window.devicePixelRatio||1);
cv.width=W*T*K;cv.height=H*T*K;
const DIRS=[{x:0,y:-1},{x:-1,y:0},{x:0,y:1},{x:1,y:0}]; // 0 arriba, 1 izquierda, 2 abajo, 3 derecha
const OPP=[2,3,0,1];
let grid,dotsLeft,maze;
/* ---------- Sonido ---------- */
let _ac=null,sonido=true;try{sonido=localStorage.getItem('pc_son')!=='0'}catch(e){}
const tono=(f,d=.06,t='square',v=.05,f2)=>{if(!sonido)return;try{const A=window.AudioContext||window.webkitAudioContext;_ac=_ac||new A();if(_ac.state==='suspended')_ac.resume();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.setValueAtTime(f,_ac.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,_ac.currentTime+d);g.gain.value=v;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.stop(_ac.currentTime+d)}catch(e){}};
const setSon=()=>{$('#bSon').textContent='Sonido: '+(sonido?'sí':'no')};setSon();
$('#bSon').onclick=()=>{sonido=!sonido;try{localStorage.setItem('pc_son',sonido?'1':'0')}catch(e){}setSon();if(sonido)tono(660,.08)};

/* ---------- Mapa y movimiento por casillas ---------- */
function parse(){grid=MAP.map(r=>r.split('').map(c=>c==='P'?' ':c));dotsLeft=0;grid.forEach(r=>r.forEach(c=>{if(c==='.'||c==='o')dotsLeft++}));dibujarLaberinto()}
function nb(c,r,d,gate){let nc=c+d.x,nr=r+d.y;if(nc<0||nc>=W){if(r!==9)return null;nc=(nc+W)%W}if(nr<0||nr>=H)return null;const t=grid[nr][nc];if(t==='#')return null;if(t==='-'&&!gate)return null;return[nc,nr]}
function bfs(c,r,tc,tr){ // primera dirección del camino más corto (con puerta abierta)
  if(c===tc&&r===tr)return -1;const first=new Map([[r*W+c,-2]]),q=[[c,r]];
  for(let i=0;i<q.length;i++){const[x,y]=q[i];for(let k=0;k<4;k++){const n=nb(x,y,DIRS[k],true);if(!n)continue;const id=n[1]*W+n[0];if(first.has(id))continue;
    first.set(id,first.get(y*W+x)===-2?k:first.get(y*W+x));if(n[0]===tc&&n[1]===tr)return first.get(id);q.push(n)}}
  return -1}

/* ---------- Estado ---------- */
let estado='idle',score=0,lives=3,level=1,readyT=0,dieT=0,clearT=0,modoI=0,modoT=7,frightT=0,combo=0,tJuego=0,comidos=0,fruta=null,popups=[],pausaPrev=null;
let pac,ghosts;
const COL={blinky:'#ff6b6b',pinky:'#ff9fd0',inky:'#5fd0e8',clyde:'#ffa94d'};
const rapidezPac=()=>Math.min(8,6.4+.12*(level-1)),rapidezFan=()=>Math.min(7,5.6+.2*(level-1)),durAsustado=()=>Math.max(1.6,7-.9*(level-1));
function posiciones(){
  pac={c:9,r:15,dx:0,dy:0,prog:0,want:-1,face:1,mouth:0};
  const mk=(n,c,r,st,timer,sc)=>({n,c,r,dx:0,dy:0,prog:0,state:st,timer,scared:false,sc});
  ghosts=[mk('blinky',9,7,'live',0,[16,-2]),mk('pinky',9,9,'house',1.0,[2,-2]),mk('inky',8,9,'house',4.5,[18,22]),mk('clyde',10,9,'house',8,[0,22])];
  ghosts.forEach(g=>{g.timer=Math.max(0,g.timer-.6*(level-1))});
  ghosts[0].dx=-1;modoI=0;modoT=7;frightT=0;combo=0;fruta=null;popups=[];
}
function nuevoNivel(){parse();comidos=0;posiciones();estado='ready';readyT=1.8;info()}
function nuevoJuego(){score=0;lives=3;level=1;pill.textContent='0';$('#ms').textContent='';$('#ov').classList.remove('on');nuevoNivel();tono(440,.15,'square',.05,880)}
const info=()=>{let b=0;try{b=+localStorage.getItem('pc_best')||0}catch(e){}$('#gameInfo').textContent=`Nivel ${level} · Vidas ${lives} · Mejor ${Math.max(b,score)}`};
const sumar=n=>{score+=n;pill.textContent=score};

/* ---------- Pacman ---------- */
function puedeIr(k){return k>=0&&nb(pac.c,pac.r,DIRS[k],false)!==null}
function setDir(k){
  if(estado==='idle'||estado==='over')return;
  pac.want=k;
  const cur=pac.dx||pac.dy?DIRS.findIndex(d=>d.x===pac.dx&&d.y===pac.dy):-1;
  if(cur>=0&&k===OPP[cur]&&pac.prog>0){ // media vuelta en pleno camino
    pac.c+=pac.dx;pac.r+=pac.dy;if(pac.c<0)pac.c=W-1;else if(pac.c>=W)pac.c=0;pac.dx=-pac.dx;pac.dy=-pac.dy;pac.prog=1-pac.prog;pac.face=k}
}
function moverPac(dt){
  let d=rapidezPac()*dt;
  while(d>0){
    if(!pac.dx&&!pac.dy){if(puedeIr(pac.want)){const v=DIRS[pac.want];pac.dx=v.x;pac.dy=v.y;pac.face=pac.want}else break}
    const falta=1-pac.prog;
    if(d<falta){pac.prog+=d;d=0;break}
    d-=falta;pac.c+=pac.dx;pac.r+=pac.dy;if(pac.c<0)pac.c=W-1;else if(pac.c>=W)pac.c=0;pac.prog=0;
    comer(pac.c,pac.r);
    if(puedeIr(pac.want)){const v=DIRS[pac.want];pac.dx=v.x;pac.dy=v.y;pac.face=pac.want}
    else{const cur=DIRS.findIndex(q=>q.x===pac.dx&&q.y===pac.dy);if(!(cur>=0&&puedeIr(cur))){pac.dx=0;pac.dy=0}}
  }
}
let alt=0;
function comer(c,r){
  const t=grid[r][c];
  if(t==='.'||t==='o'){
    grid[r][c]=' ';dotsLeft--;comidos++;
    if(t==='.'){sumar(10);tono((alt^=1)?262:330,.05,'triangle',.07)}
    else{sumar(50);frightT=durAsustado();combo=0;tono(180,.35,'sawtooth',.06,540);ghosts.forEach(g=>{if(g.state==='live'||g.state==='out'){g.scared=true;if(g.state==='live')invertir(g)}})}
    if(!fruta&&(comidos===60||comidos===150))fruta={t:9};
    if(dotsLeft===0)nivelCompleto();
  }
  if(fruta&&c===9&&r===11){const p=Math.min(1000,100*level);sumar(p);emerger(9,11,'+'+p);fruta=null;tono(700,.2,'triangle',.08,1200)}
}
function emerger(c,r,txt){popups.push({x:c+.5,y:r+.5,t:1,txt})}

/* ---------- Fantasmas ---------- */
function invertir(g){if(!g.dx&&!g.dy)return;g.c+=g.dx;g.r+=g.dy;if(g.c<0)g.c=W-1;else if(g.c>=W)g.c=0;g.dx=-g.dx;g.dy=-g.dy;g.prog=1-g.prog}
function objetivo(g){
  if(modoI%2===0)return g.sc;
  const f=DIRS[pac.face];
  if(g.n==='blinky')return[pac.c,pac.r];
  if(g.n==='pinky')return[pac.c+f.x*4,pac.r+f.y*4];
  if(g.n==='inky'){const b=ghosts[0],px=pac.c+f.x*2,py=pac.r+f.y*2;return[px+(px-b.c),py+(py-b.r)]}
  const d=(g.c-pac.c)**2+(g.r-pac.r)**2;return d>64?[pac.c,pac.r]:g.sc;
}
function elegir(g){
  let k=-1;
  if(g.state==='dead')k=bfs(g.c,g.r,9,9);
  else if(g.state==='out')k=bfs(g.c,g.r,9,7);
  else{
    const cur=g.dx||g.dy?DIRS.findIndex(d=>d.x===g.dx&&d.y===g.dy):-1;
    const ops=[0,1,2,3].filter(i=>i!==OPP[cur]&&nb(g.c,g.r,DIRS[i],false));
    if(!ops.length)k=cur>=0?OPP[cur]:-1;
    else if(g.scared)k=ops[Math.floor(Math.random()*ops.length)];
    else{const t=objetivo(g);let best=1e9;ops.forEach(i=>{const n=nb(g.c,g.r,DIRS[i],false),d=(n[0]-t[0])**2+(n[1]-t[1])**2;if(d<best){best=d;k=i}})}
  }
  if(k<0){g.dx=0;g.dy=0}else{g.dx=DIRS[k].x;g.dy=DIRS[k].y}
}
function velFan(g){if(g.state==='dead')return 11;if(g.scared)return 3.6;if(g.r===9&&(g.c<4||g.c>14))return 3;return rapidezFan()}
function moverFan(g,dt){
  if(g.state==='house'){g.timer-=dt;if(g.timer<=0){g.state='out';elegir(g)}return}
  let d=velFan(g)*dt;
  while(d>0){
    if(!g.dx&&!g.dy){elegir(g);if(!g.dx&&!g.dy)break}
    const falta=1-g.prog;
    if(d<falta){g.prog+=d;break}
    d-=falta;g.c+=g.dx;g.r+=g.dy;if(g.c<0)g.c=W-1;else if(g.c>=W)g.c=0;g.prog=0;
    if(g.state==='dead'&&g.c===9&&g.r===9){g.state='out';g.scared=false}
    if(g.state==='out'&&g.c===9&&g.r===7)g.state='live';
    elegir(g);
  }
}
const px=e=>e.c+e.dx*e.prog,py=e=>e.r+e.dy*e.prog;

/* ---------- Bucle ---------- */
function actualizar(dt){
  if(estado==='ready'){readyT-=dt;if(readyT<=0)estado='play';return}
  if(estado==='dying'){dieT+=dt;if(dieT>1.5){lives--;if(lives<=0)finJuego();else{posiciones();estado='ready';readyT=1.5;info()}}return}
  if(estado==='clear'){clearT-=dt;if(clearT<=0){level++;nuevoNivel()}return}
  if(estado!=='play')return;
  tJuego+=dt;
  if(frightT>0){frightT-=dt;if(frightT<=0){frightT=0;ghosts.forEach(g=>g.scared=false)}}
  else{modoT-=dt;if(modoT<=0){modoI++;modoT=[7,20,7,20,5,20,5,1e9][Math.min(modoI,7)];ghosts.forEach(g=>{if(g.state==='live')invertir(g)})}}
  if(fruta){fruta.t-=dt;if(fruta.t<=0)fruta=null}
  moverPac(dt);ghosts.forEach(g=>moverFan(g,dt));
  const ax=px(pac),ay=py(pac);
  for(const g of ghosts){
    if(g.state==='house'||g.state==='dead')continue;
    if(Math.hypot(px(g)-ax,py(g)-ay)<.6){
      if(g.scared){combo++;const p=200*2**(combo-1);sumar(p);emerger(px(g),py(g),'+'+p);g.state='dead';g.scared=false;tono(500,.25,'square',.07,1400)}
      else{estado='dying';dieT=0;tono(520,.9,'sawtooth',.07,60);info();return}
    }
  }
  popups.forEach(p=>p.t-=dt*.9);popups=popups.filter(p=>p.t>0);
}
function nivelCompleto(){estado='clear';clearT=1.8;$('#ms').textContent=`¡Completado el nivel ${level}!`;tono(660,.15,'triangle',.08);setTimeout(()=>tono(880,.2,'triangle',.08),150);setTimeout(()=>tono(1100,.3,'triangle',.08),320);Sala.confetti(60);setTimeout(()=>{if(estado==='clear'||estado==='ready')$('#ms').textContent=''},2600)}
function finJuego(){
  estado='over';let b=0;try{b=+localStorage.getItem('pc_best')||0;if(score>b){b=score;localStorage.setItem('pc_best',score)}}catch(e){}
  const ov=$('#ov');ov.innerHTML=`<h2>Fin del juego</h2><div class="big">${score}</div><p>${score>=b&&score>0?'¡Nuevo récord!':'Tu récord: '+b}</p><p>Llegaste al nivel ${level}</p><div class="pc-bar" style="margin-top:10px"><button class="btn" id="otra" style="background:var(--accent)">Jugar otra vez</button></div>`;
  ov.classList.add('on');$('#otra').onclick=()=>{Sala.cancel();Sala.countdown(nuevoJuego)};info();tono(200,.6,'sawtooth',.06,70)
}

/* ---------- Dibujo ---------- */
function dibujarLaberinto(){
  maze=document.createElement('canvas');maze.width=W*T*K;maze.height=H*T*K;const c=maze.getContext('2d');c.scale(K,K);
  const pared=(x,y)=>x>=0&&x<W&&y>=0&&y<H&&grid[y][x]==='#';
  c.fillStyle='#1d2a37';grid.forEach((row,y)=>row.forEach((t,x)=>{if(t==='#')c.fillRect(x*T,y*T,T,T)}));
  const b=3,col='#7fb0d3';c.fillStyle=col;
  grid.forEach((row,y)=>row.forEach((t,x)=>{if(t!=='#')return;const X=x*T,Y=y*T;
    const u=!pared(x,y-1)&&y>0,d=!pared(x,y+1)&&y<H-1,l=!pared(x-1,y)&&x>0,r=!pared(x+1,y)&&x<W-1;
    if(u)c.fillRect(X,Y,T,b);if(d)c.fillRect(X,Y+T-b,T,b);if(l)c.fillRect(X,Y,b,T);if(r)c.fillRect(X+T-b,Y,b,T);
    if(pared(x,y-1)&&pared(x-1,y)&&!pared(x-1,y-1)&&x>0&&y>0)c.fillRect(X,Y,b,b);
    if(pared(x,y-1)&&pared(x+1,y)&&!pared(x+1,y-1)&&x<W-1&&y>0)c.fillRect(X+T-b,Y,b,b);
    if(pared(x,y+1)&&pared(x-1,y)&&!pared(x-1,y+1)&&x>0&&y<H-1)c.fillRect(X,Y+T-b,b,b);
    if(pared(x,y+1)&&pared(x+1,y)&&!pared(x+1,y+1)&&x<W-1&&y<H-1)c.fillRect(X+T-b,Y+T-b,b,b)}));
  grid.forEach((row,y)=>row.forEach((t,x)=>{if(t==='-'){c.fillStyle='#ff9fd0';c.fillRect(x*T,y*T+T/2-2,T,4)}}));
}
function fantasma(g,t){
  const x=(px(g)+.5)*T,y=(py(g)+.5)*T+(g.state==='house'?Math.sin(t*6+g.timer)*3:0),r=T*.43;
  if(g.state!=='dead'){
    const susto=g.scared,parp=susto&&frightT<2&&Math.floor(frightT*6)%2===0;
    ctx.fillStyle=susto?(parp?'#f5f5f5':'#4a63d0'):COL[g.n];
    ctx.beginPath();ctx.arc(x,y-1,r,Math.PI,0);ctx.lineTo(x+r,y+r);
    const n=3,w=2*r/n;for(let i=0;i<n;i++){const ex=x+r-(i+1)*w;ctx.quadraticCurveTo(x+r-i*w-w*.25,y+r-5,x+r-i*w-w*.5,y+r-1);ctx.quadraticCurveTo(x+r-i*w-w*.75,y+r+2,ex,y+r)}
    ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(105,65,35,.35)';ctx.lineWidth=1.2;ctx.stroke();
  }
  if(g.scared&&g.state!=='dead'){ctx.fillStyle=frightT<2&&Math.floor(frightT*6)%2===0?'#4a63d0':'#fff';[-1,1].forEach(s=>{ctx.beginPath();ctx.arc(x+s*r*.38,y-3,2.2,0,7);ctx.fill()});
    ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=1.6;ctx.beginPath();for(let i=0;i<5;i++)ctx.lineTo(x-r*.6+i*r*.3,y+4+(i%2?-2.5:2.5));ctx.stroke();return}
  const ox=(g.dx||0)*2.2,oy=(g.dy||0)*2.2;
  [-1,1].forEach(s=>{ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x+s*r*.4,y-3,r*.3,r*.38,0,0,7);ctx.fill();ctx.fillStyle='#26323b';ctx.beginPath();ctx.arc(x+s*r*.4+ox,y-3+oy,2.4,0,7);ctx.fill()});
}
function comecocos(t){
  const x=(px(pac)+.5)*T,y=(py(pac)+.5)*T,r=T*.44,ang=[-Math.PI/2,Math.PI,Math.PI/2,0][pac.face];
  let m;if(estado==='dying'){m=Math.PI*Math.min(1,dieT/1.2)}else m=(pac.dx||pac.dy)&&estado==='play'?Math.abs(Math.sin(t*14))*.75+.05:.3;
  if(estado==='dying'&&dieT>1.25)return;
  ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,r,ang+m,ang+2*Math.PI-m);ctx.closePath();ctx.fill();ctx.strokeStyle='#d9a520';ctx.lineWidth=1.6;ctx.stroke();
}
function dibujar(t){
  ctx.setTransform(K,0,0,K,0,0);ctx.clearRect(0,0,W*T,H*T);
  ctx.setTransform(1,0,0,1,0,0);
  if(estado==='clear'&&Math.floor(clearT*5)%2===0){ctx.filter='brightness(2.2)'}
  ctx.drawImage(maze,0,0);ctx.filter='none';ctx.setTransform(K,0,0,K,0,0);
  const blink=Math.floor(t*3)%2===0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];
    if(c==='.'){ctx.fillStyle='#f6ac69';ctx.beginPath();ctx.arc(x*T+T/2,y*T+T/2,2.6,0,7);ctx.fill()}
    else if(c==='o'&&blink){ctx.fillStyle='#ffe9a8';ctx.beginPath();ctx.arc(x*T+T/2,y*T+T/2,6.5,0,7);ctx.fill()}}
  if(fruta){const x=9*T+T/2,y=11*T+T/2;ctx.strokeStyle='#5fa683';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-4,y+2);ctx.quadraticCurveTo(x,y-9,x+5,y-8);ctx.moveTo(x+4,y+4);ctx.quadraticCurveTo(x+4,y-6,x+5,y-8);ctx.stroke();
    ctx.fillStyle='#ff5e5e';[[x-5,y+5],[x+4,y+6]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(a,b,5,0,7);ctx.fill()})}
  if(estado!=='dying'||dieT<.3)ghosts.forEach(g=>fantasma(g,t));
  comecocos(t);
  popups.forEach(p=>{ctx.globalAlpha=Math.min(1,p.t*1.5);ctx.fillStyle='#fff';ctx.font='700 13px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x*T,(p.y-(1-p.t)*.8)*T);ctx.globalAlpha=1});
  if(estado==='ready'){ctx.fillStyle='#ffd54a';ctx.font='600 22px Fredoka,sans-serif';ctx.textAlign='center';ctx.fillText('¡LISTO!',W*T/2,11*T+T*.78)}
  if(estado==='pause'){ctx.fillStyle='rgba(23,29,35,.75)';ctx.fillRect(0,0,W*T,H*T);ctx.fillStyle='#ece6d9';ctx.font='600 30px Fredoka,sans-serif';ctx.textAlign='center';ctx.fillText('Pausa',W*T/2,H*T/2);ctx.font='600 14px sans-serif';ctx.fillText('Toca o pulsa P para seguir',W*T/2,H*T/2+26)}
}
let ult=0,raf=0;
function bucle(ts){raf=requestAnimationFrame(bucle);const dt=Math.min(.05,(ts-ult)/1000||0);ult=ts;if(estado!=='pause'&&estado!=='idle')actualizar(dt);dibujar(ts/1000)}

/* ---------- Pausa ---------- */
function pausar(){if(estado==='play'||estado==='ready'){pausaPrev=estado;estado='pause';$('#bPausa').textContent='Seguir'}}
function seguir(){if(estado==='pause'){estado=pausaPrev||'play';$('#bPausa').textContent='Pausa'}}
$('#bPausa').onclick=()=>estado==='pause'?seguir():pausar();
cv.addEventListener('click',()=>{if(estado==='pause')seguir()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pausar()});
addEventListener('blur',pausar);

/* ---------- Controles ---------- */
const KEYS={ArrowUp:0,w:0,W:0,ArrowLeft:1,a:1,A:1,ArrowDown:2,s:2,S:2,ArrowRight:3,d:3,D:3};
addEventListener('keydown',e=>{
  if(e.key in KEYS){e.preventDefault();if(estado==='pause')seguir();setDir(KEYS[e.key])}
  else if(e.key==='p'||e.key==='P'||e.key===' '){e.preventDefault();estado==='pause'?seguir():pausar()}
});
let sx=0,sy=0,sw=false;
cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;sw=true;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!sw)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>16){setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?3:1):(dy>0?2:0));sx=e.clientX;sy=e.clientY}});
cv.addEventListener('pointerup',()=>{sw=false});cv.addEventListener('pointercancel',()=>{sw=false});
document.querySelectorAll('#dp button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();if(estado==='pause')seguir();setDir(+b.dataset.d);b.classList.add('on')});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove('on')))});

/* ---------- Inicio ---------- */
const IMG='<img class="gi" src="../img/pacman.svg" alt="">';
function intro(){Sala.cancel();if(estado!=='idle'&&estado!=='over')pausar();
  Sala.intro({icon:IMG,title:'Pacman',sub:'Come todos los puntos sin que te atrapen',accent:'#f57c73',
   tips:['Muévete con las flechas, WASD, deslizando el dedo o con la cruceta.','Las píldoras grandes asustan a los fantasmas: ¡cómetelos!','Tienes 3 vidas. Si limpias el laberinto, pasas de nivel.'],
   onBack:()=>{location.href=RAIZ+'index.html'},onStart:()=>{if(estado==='pause'){estado=pausaPrev||'play';$('#bPausa').textContent='Pausa'}else nuevoJuego()}})}
$('#replay').onclick=()=>{$('#ov').classList.remove('on');estado='idle';intro()};
parse();posiciones();info();dibujar(0);raf=requestAnimationFrame(bucle);
window.__pc={get estado(){return estado},get score(){return score},get lives(){return lives},get level(){return level},get dots(){return dotsLeft},set dots(v){dotsLeft=v},get pac(){return pac},get ghosts(){return ghosts},setDir,nuevoJuego,get grid(){return grid},W,H,nb,bfs,set frightT(v){frightT=v}};
intro();
})();
</script></body></html>
