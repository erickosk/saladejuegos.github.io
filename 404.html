<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Página no encontrada · Sala de Juegos</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff1e4;color:#3b2518;font:600 18px/1.5 system-ui,sans-serif;text-align:center;padding:24px}
h1{font-size:clamp(30px,6vw,48px);margin:0 0 8px}p{margin:0 0 22px;color:#85695b}
a{display:inline-block;padding:14px 28px;border-radius:12px;background:#f5a962;color:#3b2518;font-weight:800;text-decoration:none}a:focus-visible{outline:3px solid #3a281c;outline-offset:2px}</style></head>
<body><main><h1>Esta página no existe</h1><p>Puede que el enlace esté mal escrito o que el juego ya no esté disponible.</p><a id="inicio" href="/">Volver a la Sala de Juegos</a></main>
<script>
// En GitHub Pages de proyecto (usuario.github.io/repo/) la raíz es /repo/, no /
(function(){var p=location.pathname.split('/').filter(Boolean),a=document.getElementById('inicio');
if(/\.github\.io$/.test(location.hostname)&&p.length)a.href='/'+p[0]+'/';})();
</script></body></html>
